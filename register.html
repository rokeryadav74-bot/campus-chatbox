{% extends 'base.html' %}{% block content %}<main class="auth"><div class="intro"><span class="tag">STUDENT COMMUNITY</span><h1>Start connecting<br><em>today.</em></h1><p>Create your account and join the campus conversation.</p><div class="orb">✦</div></div><div class="panel"><h2>Create account</h2><p class="muted">A few details to get started.</p><form method="post"><label>Display name</label><input name="name" placeholder="Your name" required><label>Email address</label><input name="email" type="email" placeholder="you@college.edu" required><label>Password</label><input name="password" type="password" minlength="6" placeholder="At least 6 characters" required><button>Create account</button></form><p class="muted center">Already registered? <a href="{{ url_for('login') }}">Log in</a></p></div></main>{% endblock %}
