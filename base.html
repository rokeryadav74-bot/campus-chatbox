<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Campus Chatbox</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"></head><body><div class="shell"><header><div class="brand"><span class="logo">C</span><div><b>Campus Chatbox</b><small>Connect. Communicate. Campus.</small></div></div>{% if session.get('user_id') %}<a class="logout" href="{{ url_for('logout') }}">Logout ↗</a>{% endif %}</header>{% with msgs=get_flashed_messages() %}{% if msgs %}<div class="flash">{{ msgs[0] }}</div>{% endif %}{% endwith %}{% block content %}{% endblock %}<footer>Campus Chatbox · Student community</footer></div></body></html>
